# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, refactor/standards-first-reconciliation]
  pull_request:

jobs:
  test-ts:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --if-present -r lint
      - run: pnpm --if-present -r test
      - run: pnpm test:scenarios
      - name: Poster verifier bundle is up to date
        run: |
          pnpm -C apps/demo-web build:poster
          git diff --exit-code site/m375a/verifier.js

  test-py:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.17
      - name: Install locked workspace
        run: uv sync --locked --all-packages --extra dev
      - name: Run pytest
        run: uv run --locked --all-packages --extra dev pytest packages/core-py/tests

  validate-schemas:
    name: Validate JSON schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:schemas

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: .markdownlint.json
          globs: '**/*.md'
