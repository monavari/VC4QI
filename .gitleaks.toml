[extend]
useDefault = true

[[rules]]
id = "test-key-material"
description = "Detects private key PEM blocks; the repository commits none"
regex = '''-----BEGIN (EC |RSA |OPENSSH )?PRIVATE KEY-----'''

[[rules]]
id = "generic-api-key-extended"
description = "Generic high-entropy API key pattern"
regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key)\s*[:=]\s*["\']?[A-Za-z0-9/+]{32,}["\']?'''
[rules.allowlist]
paths = ['''packages/[^/]+/tests/''', '''testdata/''', '''bindings/experimental/''']

[allowlist]
description = "Global allowlist"
paths = [
  '''\.gitleaks\.toml''',
  '''SECURITY\.md''',
]
