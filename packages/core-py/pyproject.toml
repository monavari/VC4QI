# SPDX-License-Identifier: Apache-2.0
[project]
name = "qi-vc-core"
version = "0.1.0"
description = "Python core library for QI-VC credential issuance and verification"
requires-python = ">=3.12"
dependencies = [
    "pyld>=2.0.4",
    "PyNaCl>=1.5.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qi_vc_core"]
