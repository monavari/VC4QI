[tool.uv.workspace]
members = [
  "packages/core-py",
  "packages/verifier-service",
  "packages/lims-adapter",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/core-py/tests", "packages/verifier-service/tests", "tests/integration"]
