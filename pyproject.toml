# SPDX-License-Identifier: Apache-2.0
[tool.uv.workspace]
members = [
  "packages/core-py",
]

[dependency-groups]
dev = ["ruff==0.4.5", "mypy>=1.10,<2"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["packages/core-py/tests"]
